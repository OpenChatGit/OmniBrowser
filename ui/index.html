<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omni Browser</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/scrollbar.css" />
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/titlebar.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/tooltip.css" />
  <link rel="stylesheet" href="css/topbar.css" />
  <link rel="stylesheet" href="css/media.css" />
  <link rel="stylesheet" href="css/browser.css" />
</head>
<body>
  <div class="app-root">
    <header class="titlebar" role="banner">
      <div class="titlebar-left">
        <div class="titlebar-tabs" id="browser-tabs" role="tablist" aria-label="Browser tabs"></div>
        <button type="button" class="titlebar-tab-new" id="browser-tab-new" aria-label="New Tab"></button>
      </div>
      <div class="titlebar-drag" aria-hidden="true"></div>
      <div class="titlebar-controls">
        <button type="button" class="titlebar-btn" id="titlebar-min" aria-label="Minimize"></button>
        <button type="button" class="titlebar-btn" id="titlebar-max" aria-label="Maximize"></button>
        <button type="button" class="titlebar-btn close" id="titlebar-close" aria-label="Close"></button>
      </div>
    </header>

    <div class="topbar" id="topbar" role="navigation" aria-label="Browser">
      <div class="topbar-nav">
        <button type="button" class="topbar-btn" id="browser-back" aria-label="Back" disabled></button>
        <button type="button" class="topbar-btn" id="browser-forward" aria-label="Forward" disabled></button>
        <button type="button" class="topbar-btn" id="browser-reload" aria-label="Reload" data-tooltip="Reload (Shift+click: Hard Reload)" disabled></button>
      </div>
      <div class="topbar-center">
        <button type="button" class="topbar-btn topbar-bookmark" id="browser-bookmark" aria-label="Bookmark page" aria-pressed="false" data-tooltip="Bookmark"></button>
        <form class="topbar-search" id="browser-search-form" autocomplete="off">
          <span class="topbar-search-icon" aria-hidden="true" data-icon="search"></span>
          <input
            type="text"
            class="topbar-search-input"
            id="browser-search-input"
            name="q"
            spellcheck="false"
            autocomplete="off"
            aria-label="Search or enter address"
            placeholder="Search or enter address"
          />
          <button type="submit" class="topbar-search-go" aria-label="Go"></button>
        </form>
      </div>
      <div class="topbar-actions">
        <button
          type="button"
          class="topbar-btn topbar-download"
          id="browser-download"
          aria-label="Downloads"
          data-tooltip="Downloads"
          hidden
        >
          <svg class="topbar-download-ring" viewBox="0 0 36 36" aria-hidden="true">
            <circle class="topbar-download-track" cx="18" cy="18" r="14.5" />
            <circle class="topbar-download-progress" cx="18" cy="18" r="14.5" />
          </svg>
          <span class="topbar-download-glyph" id="browser-download-icon"></span>
        </button>
        <div class="topbar-media-wrap" id="browser-media-wrap" hidden>
          <button
            type="button"
            class="topbar-btn topbar-media"
            id="browser-media"
            aria-label="Media controls"
            aria-haspopup="dialog"
            aria-expanded="false"
            data-tooltip="Media"
          ></button>
        </div>
        <button
          type="button"
          class="topbar-btn"
          id="browser-menu"
          aria-label="Menu"
          aria-haspopup="menu"
          aria-expanded="false"
          data-tooltip="Menu"
        ></button>
      </div>
    </div>

    <div class="shell" id="shell">
      <section class="workspace" id="workspace" aria-label="Browser">
        <div class="browser" id="browser" data-mode="start">
          <div class="browser-start" id="browser-start">
            <div class="browser-start-glow" aria-hidden="true"></div>
            <div
              class="browser-start-notice"
              id="browser-start-notice"
              role="status"
            >
              <span class="browser-start-notice-label">Preview</span>
              <span class="browser-start-notice-text"
                >UI is being worked on — not final.</span
              >
              <button
                type="button"
                class="browser-start-notice-close"
                id="browser-start-notice-close"
                aria-label="Dismiss"
              >
                ×
              </button>
            </div>
            <time class="browser-start-clock" id="browser-start-clock" aria-live="polite">
              <span class="browser-start-clock-time" id="browser-start-clock-time"></span>
              <span class="browser-start-clock-period" id="browser-start-clock-period"></span>
            </time>
            <div class="browser-start-tools">
              <div class="browser-engine">
                <div
                  class="browser-engine-btn"
                  id="browser-engine"
                  role="button"
                  tabindex="0"
                  aria-label="Search engine"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="browser-engine-menu"
                  data-tooltip="Search engine"
                >
                  <img class="browser-engine-icon" id="browser-engine-icon" alt="" draggable="false" />
                </div>
                <script>
                  (function () {
                    var KEY = "omni.searchEngine";
                    var ids = [
                      "qubrain",
                      "brave",
                      "duckduckgo",
                      "qwant",
                      "google",
                      "bing",
                      "startpage",
                      "ecosia",
                    ];
                    var id = "google";
                    try {
                      var stored = localStorage.getItem(KEY);
                      if (stored && ids.indexOf(stored) !== -1) {
                        id = stored;
                      }
                    } catch (e) {}
                    var img = document.getElementById("browser-engine-icon");
                    if (img) {
                      img.src =
                        id === "qubrain"
                          ? "assets/qubrain.svg"
                          : "assets/QuBrain-icons/" + id + "-color.svg";
                    }
                  })();
                </script>
                <div
                  class="browser-engine-menu"
                  id="browser-engine-menu"
                  role="listbox"
                  aria-label="Search engines"
                  hidden
                ></div>
              </div>
            </div>
            <div class="browser-brand-row">
              <img class="browser-brand-mark" src="assets/qubrain.svg" alt="" width="40" height="40" />
              <h1 class="browser-brand">Omni Browser</h1>
            </div>
            <form class="browser-search" id="browser-start-search-form" autocomplete="off">
              <span class="browser-search-icon" aria-hidden="true" data-icon="search"></span>
              <input
                type="text"
                class="browser-search-input"
                id="browser-start-search-input"
                name="q"
                spellcheck="false"
                autocomplete="off"
                aria-label="Search or enter address"
                placeholder="Search the web or type a URL"
              />
              <button type="submit" class="browser-search-go" aria-label="Go"></button>
            </form>
          </div>

          <div class="browser-view" id="browser-view" hidden>
            <div class="browser-view-slot" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="vendor/lucide.min.js"></script>
  <script src="js/lib/icons.js"></script>
  <script src="js/lib/tooltip.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/features/shell/window-icons.js"></script>
  <script src="js/features/shell/titlebar.js"></script>
  <script src="js/features/browser/url.js"></script>
  <script src="js/features/browser/browser.js"></script>
  <script src="js/features/browser/media.js"></script>
  <script src="js/features/browser/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
