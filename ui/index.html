<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omni Browser</title>
  <script>
    (function () {
      var privateMode = /(?:\?|&)private=1(?:&|$)/.test(location.search || "");
      window.OmniPrivate = { enabled: privateMode };
      if (privateMode) {
        document.documentElement.dataset.private = "1";
        document.title = "Omni Private";
      }
      var KEY = "omni.appearance";
      var pref = "system";
      var cachedTheme = "";
      try {
        pref = localStorage.getItem(KEY) || "system";
        cachedTheme = localStorage.getItem(KEY + ".theme") || "";
      } catch (e) {}
      if (pref !== "light" && pref !== "dark") pref = "system";
      var dark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = pref === "light" ? "light" : pref === "dark" ? "dark"
        : (cachedTheme === "light" || cachedTheme === "dark") ? cachedTheme
        : (dark ? "dark" : "light");
      if (privateMode) theme = "dark";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/scrollbar.css" />
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/titlebar.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/tooltip.css" />
  <link rel="stylesheet" href="css/topbar.css" />
  <link rel="stylesheet" href="css/media.css" />
  <link rel="stylesheet" href="css/browser.css" />
  <link rel="stylesheet" href="css/adblock.css" />
  <link rel="stylesheet" href="css/autocomplete.css" />
  <link rel="stylesheet" href="css/update.css" />
</head>
<body>
  <div class="app-root">
    <header class="titlebar" role="banner">
      <div class="titlebar-left">
        <div class="titlebar-tabs" id="browser-tabs" role="tablist" aria-label="Browser tabs"></div>
        <button type="button" class="titlebar-tab-new" id="browser-tab-new" aria-label="New Tab"></button>
      </div>
      <div class="titlebar-drag" aria-hidden="true"></div>
      <div class="titlebar-controls">
        <button type="button" class="titlebar-btn" id="titlebar-min" aria-label="Minimize"></button>
        <button type="button" class="titlebar-btn" id="titlebar-max" aria-label="Maximize"></button>
        <button type="button" class="titlebar-btn close" id="titlebar-close" aria-label="Close"></button>
      </div>
    </header>

    <div class="topbar" id="topbar" role="navigation" aria-label="Browser">
      <div class="topbar-nav">
        <button type="button" class="topbar-btn" id="browser-back" aria-label="Back" disabled></button>
        <button type="button" class="topbar-btn" id="browser-forward" aria-label="Forward" disabled></button>
        <button type="button" class="topbar-btn" id="browser-reload" aria-label="Reload" data-tooltip="Reload (Shift+click: Hard Reload)" disabled></button>
      </div>
      <div class="topbar-center">
        <button type="button" class="topbar-btn topbar-bookmark" id="browser-bookmark" aria-label="Bookmark page" aria-pressed="false" data-tooltip="Bookmark"></button>
        <form class="topbar-search" id="browser-search-form" autocomplete="off">
          <span class="topbar-search-icon" aria-hidden="true">
            <img
              class="topbar-search-mark"
              id="browser-search-mark"
              src="assets/QuBrain-new/q-white.svg"
              alt=""
              draggable="false"
            />
          </span>
          <input
            type="text"
            class="topbar-search-input"
            id="browser-search-input"
            name="q"
            spellcheck="false"
            autocomplete="off"
            aria-label="Search or enter address"
            placeholder="Search or enter address"
          />
          <span class="topbar-search-divider" aria-hidden="true"></span>
          <button
            type="button"
            class="topbar-btn topbar-adblock is-on"
            id="browser-adblock"
            aria-label="Ad blocking"
            aria-haspopup="dialog"
            aria-expanded="false"
            data-tooltip="Ad blocking"
          ></button>
        </form>
      </div>
      <div class="topbar-actions">
        <button
          type="button"
          class="topbar-btn topbar-download"
          id="browser-download"
          aria-label="Downloads"
          data-tooltip="Downloads"
          hidden
        >
          <svg class="topbar-download-ring" viewBox="0 0 36 36" aria-hidden="true">
            <circle class="topbar-download-track" cx="18" cy="18" r="14.5" />
            <circle class="topbar-download-progress" cx="18" cy="18" r="14.5" />
          </svg>
          <span class="topbar-download-glyph" id="browser-download-icon"></span>
        </button>
        <div class="topbar-media-wrap" id="browser-media-wrap" hidden>
          <button
            type="button"
            class="topbar-btn topbar-media"
            id="browser-media"
            aria-label="Media controls"
            aria-haspopup="dialog"
            aria-expanded="false"
            data-tooltip="Media"
          ></button>
        </div>
        <div class="topbar-update-wrap" id="browser-update-wrap" hidden>
          <button
            type="button"
            class="topbar-btn topbar-btn-update"
            id="browser-update-btn"
            aria-label="New update available"
            aria-haspopup="dialog"
            aria-expanded="false"
            data-tooltip="Update available"
          >
            <span class="topbar-update-inner">
              <i data-lucide="sparkles" class="icon topbar-update-icon"></i>
              <span class="topbar-update-label">Update</span>
            </span>
            <span class="topbar-update-dot" aria-hidden="true"></span>
          </button>
          <div class="update-flyout" id="browser-update-flyout" role="dialog" aria-labelledby="update-flyout-title" hidden>
            <div class="update-flyout-header">
              <div class="update-flyout-badge-wrap">
                <span class="update-flyout-badge-icon">
                  <i data-lucide="arrow-up-circle" class="icon"></i>
                </span>
                <div class="update-flyout-header-text">
                  <span class="update-flyout-title" id="update-flyout-title">Update Available</span>
                  <span class="update-flyout-version" id="update-flyout-version">v0.0.0</span>
                </div>
              </div>
              <button type="button" class="update-flyout-close" id="update-flyout-close" aria-label="Close update panel">
                <i data-lucide="x" class="icon"></i>
              </button>
            </div>
            <div class="update-flyout-content">
              <p class="update-flyout-notes" id="update-flyout-notes">
                A new version of OmniBrowser is available.
              </p>
            </div>
            <div class="update-flyout-actions">
              <a href="#" target="_blank" rel="noopener noreferrer" class="update-btn-release" id="update-flyout-link">
                <i data-lucide="download" class="icon"></i>
                <span>Download Release</span>
              </a>
              <button type="button" class="update-btn-dismiss" id="update-flyout-dismiss">Later</button>
            </div>
          </div>
        </div>
        <button
          type="button"
          class="topbar-btn"
          id="browser-menu"
          aria-label="Menu"
          aria-haspopup="menu"
          aria-expanded="false"
          data-tooltip="Menu"
        ></button>
      </div>
    </div>

    <div class="shell" id="shell">
      <section class="workspace" id="workspace" aria-label="Browser">
        <div class="browser" id="browser" data-mode="start">
          <div class="browser-start" id="browser-start">
            <div
              class="browser-start-notice"
              id="browser-start-notice"
              role="status"
            >
              <span class="browser-start-notice-label">Preview</span>
              <span class="browser-start-notice-text"
                >UI is being worked on — not final.</span
              >
              <button
                type="button"
                class="browser-start-notice-close"
                id="browser-start-notice-close"
                aria-label="Dismiss"
              >
                ×
              </button>
            </div>
            <time class="browser-start-clock" id="browser-start-clock" aria-live="polite">
              <span class="browser-start-clock-time" id="browser-start-clock-time"></span>
              <span class="browser-start-clock-period" id="browser-start-clock-period"></span>
            </time>
            <div class="browser-start-tools">
              <div class="browser-engine">
                <div
                  class="browser-engine-btn"
                  id="browser-engine"
                  role="button"
                  tabindex="0"
                  aria-label="Search engine"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="browser-engine-menu"
                  data-tooltip="Search engine"
                >
                  <img class="browser-engine-icon" id="browser-engine-icon" alt="" draggable="false" />
                </div>
                <script>
                  (function () {
                    var KEY = "omni.searchEngine";
                    var ids = [
                      "qubrain",
                      "brave",
                      "duckduckgo",
                      "qwant",
                      "google",
                      "bing",
                      "startpage",
                      "ecosia",
                    ];
                    var id = "google";
                    try {
                      var stored = localStorage.getItem(KEY);
                      if (stored && ids.indexOf(stored) !== -1) {
                        id = stored;
                      }
                    } catch (e) {}
                    var img = document.getElementById("browser-engine-icon");
                    if (img) {
                      img.src =
                        id === "qubrain"
                          ? "assets/qubrain.svg"
                          : "assets/QuBrain-icons/" + id + "-color.svg";
                    }
                  })();
                </script>
                <div
                  class="browser-engine-menu"
                  id="browser-engine-menu"
                  role="listbox"
                  aria-label="Search engines"
                  hidden
                ></div>
              </div>
            </div>
            <div class="browser-brand-row">
              <img class="browser-brand-mark" src="assets/QuBrain-new/q-white.svg" alt="" width="33" height="40" />
              <h1 class="browser-brand" id="browser-brand">Omni Browser</h1>
              <script>
                if (window.OmniPrivate && OmniPrivate.enabled) {
                  var brand = document.getElementById("browser-brand");
                  if (brand) {
                    brand.textContent = "Omni Private";
                  }
                }
              </script>
            </div>
            <div class="browser-start-search-wrap" id="browser-start-search-wrap">
              <form class="browser-search" id="browser-start-search-form" autocomplete="off">
                <input
                  type="text"
                  class="browser-search-input"
                  id="browser-start-search-input"
                  name="q"
                  spellcheck="false"
                  autocomplete="off"
                  aria-label="Search or enter address"
                  placeholder="Search the web or type a URL"
                />
                <button type="submit" class="browser-search-go" aria-label="Go"></button>
              </form>
              <div class="browser-start-media-bar" id="browser-start-media-bar" role="region" aria-label="Media Player" hidden>
                <div class="browser-start-media-main">
                  <div class="browser-start-media-art-wrap" id="browser-start-media-art-wrap" title="Switch to tab">
                    <img class="browser-start-media-art" id="browser-start-media-art" alt="" />
                    <div class="browser-start-media-art-fallback" id="browser-start-media-art-fallback">
                      <span class="icon" data-icon="music"></span>
                    </div>
                  </div>
                  <div class="browser-start-media-info" id="browser-start-media-info" title="Switch to tab">
                    <div class="browser-start-media-title" id="browser-start-media-title"></div>
                    <div class="browser-start-media-sub">
                      <span class="browser-start-media-artist" id="browser-start-media-artist"></span>
                    </div>
                  </div>
                  <button type="button" class="browser-start-media-btn browser-start-media-play" id="browser-start-media-play" aria-label="Play / Pause" data-tooltip="Play / Pause"></button>
                </div>
              </div>
            </div>
            <div class="browser-start-stats">
              <button
                type="button"
                class="browser-start-stats-toggle"
                id="browser-start-stats-toggle"
                aria-expanded="false"
                aria-controls="browser-start-stats-card"
              >
                Show Statistics
              </button>
              <div
                class="browser-start-stats-card"
                id="browser-start-stats-card"
                role="status"
                hidden
              >
                <div class="browser-start-stats-card-label">Blocked so far</div>
                <div class="browser-start-stats-card-value" id="browser-start-stats-value">
                  0
                </div>
                <div class="browser-start-stats-card-sub">
                  trackers, ads, and more
                </div>
              </div>
            </div>
          </div>

          <div class="browser-view" id="browser-view" hidden>
            <div class="browser-view-slot" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    <!-- AI Luminous Frame Border -->
    <div class="ai-glow-overlay" id="ai-glow-overlay" aria-hidden="true"></div>

    <!-- Floating AI Agent Control Pill (bottom-center) -->
    <div class="ai-control-pill" id="ai-control-pill" role="status" aria-live="polite" hidden>
      <div class="ai-control-pill-content">
        <span class="ai-control-pill-text">Agent Controlled</span>
      </div>
      <button type="button" class="ai-control-pill-btn" id="ai-control-pause-btn" aria-label="Take Control">
        <span class="ai-control-pill-btn-icon" id="ai-control-btn-icon"></span>
        <span>Take Control</span>
      </button>
    </div>
  </div>

  <script src="vendor/lucide.min.js"></script>
  <script src="js/lib/icons.js"></script>
  <script src="js/lib/tooltip.js"></script>
  <script src="js/lib/overlay-manager.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/lib/theme.js"></script>
  <script src="js/features/shell/window-icons.js"></script>
  <script src="js/features/shell/titlebar.js"></script>
  <script src="js/features/browser/url.js"></script>
  <script src="js/features/browser/browser.js"></script>
  <script src="js/features/browser/media.js"></script>
  <script src="js/features/browser/menu.js"></script>
  <script src="js/features/browser/adblock.js"></script>
  <script src="js/features/browser/autocomplete.js"></script>
  <script src="js/features/browser/update-checker.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
