<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Downloads</title>
  <script>
    (function () {
      var KEY = "omni.appearance";
      var pref = "system";
      var cachedTheme = "";
      try {
        pref = localStorage.getItem(KEY) || "system";
        cachedTheme = localStorage.getItem(KEY + ".theme") || "";
      } catch (e) {}
      if (pref !== "light" && pref !== "dark") pref = "system";
      var dark = !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = pref === "light" ? "light" : pref === "dark" ? "dark"
        : (cachedTheme === "light" || cachedTheme === "dark") ? cachedTheme
        : (dark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/scrollbar.css" />
  <link rel="stylesheet" href="css/downloads.css" />
</head>
<body>
  <div class="hist">
    <aside class="hist-aside" aria-label="Downloads">
      <div class="hist-brand">
        <img class="hist-brand-mark" src="assets/qubrain.svg" alt="" width="28" height="28" />
        <span class="hist-brand-name">Downloads</span>
      </div>
      <nav class="hist-navs" aria-label="Downloads actions">
        <button type="button" class="hist-nav is-active" id="dl-nav-omni" data-nav="omni">
          Omni Browser downloads
        </button>
        <button type="button" class="hist-nav" id="dl-nav-clear" data-nav="clear">
          Clear downloads
        </button>
      </nav>
    </aside>

    <main class="hist-main">
      <div class="hist-search-row">
        <form class="hist-search" id="dl-search" role="search" autocomplete="off">
          <svg class="hist-search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input
            class="hist-search-input"
            id="dl-q"
            type="search"
            name="q"
            placeholder="Search downloads"
            spellcheck="false"
            aria-label="Search downloads"
          />
        </form>
      </div>

      <div class="hist-list" id="dl-list" aria-live="polite"></div>
      <p class="hist-empty" id="dl-empty" hidden>No downloads yet.</p>
    </main>
  </div>
  <script src="js/bridge.js"></script>
  <script src="js/lib/theme.js"></script>
  <script>if (window.OmniTheme) OmniTheme.boot();</script>
  <script src="js/downloads.js"></script>
</body>
</html>
