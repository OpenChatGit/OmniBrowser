services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: qsearch-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=https://searx.qubrain.org/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-to-a-long-random-string}
    restart: unless-stopped
    networks:
      - qsearch
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  # Named Cloudflare Tunnel — starts with compose, no manual quick-tunnel.
  # Hostname: https://searx.qubrain.org → http://searxng:8080
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: qsearch-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      - searxng
    networks:
      - qsearch

networks:
  qsearch:
    name: qsearch
