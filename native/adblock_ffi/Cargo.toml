[package]
name = "omni_adblock_ffi"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "C FFI wrapper around Brave adblock-rust for Omni Browser"

[lib]
name = "omni_adblock_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
adblock = { version = "0.13", default-features = true, features = ["resource-assembler", "css-validation"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
